<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Omar Data Analyst workflow — data sources to analytics and business insights">

  <title>Omar — Data Analytics Workflow</title>
  <desc>
    Animated data flow from raw data sources through Omar's analytics hub
    into SQL, Python, Power BI and Excel, ending with actionable business insights.
  </desc>

  <defs>

    <!-- Background -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0b0e14" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path
        d="M32 0H0V32"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.055"
        stroke-width="1"/>
    </pattern>

    <!-- Cards -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151a24"/>
      <stop offset="100%" stop-color="#10141c"/>
    </linearGradient>

    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="48%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <radialGradient id="hubGlow">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Incoming paths -->
    <path id="source1" d="M150 300 C150 335 310 350 410 350"/>
    <path id="source2" d="M350 300 C350 325 400 340 440 350"/>
    <path id="source3" d="M600 300 L600 350"/>
    <path id="source4" d="M850 300 C850 325 800 340 760 350"/>
    <path id="source5" d="M1050 300 C1050 335 890 350 790 350"/>

    <!-- Hub to tools -->
    <path id="tool1" d="M430 475 C430 505 180 505 180 550"/>
    <path id="tool2" d="M515 475 C515 515 450 515 450 550"/>
    <path id="tool3" d="M685 475 C685 515 750 515 750 550"/>
    <path id="tool4" d="M770 475 C770 505 1020 505 1020 550"/>

    <!-- Final flow -->
    <path id="finalFlow" d="M600 645 L600 690"/>

  </defs>

  <!-- ========================================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================================= -->

  <rect width="1200" height="720" fill="#0b0e14"/>
  <rect width="1200" height="720" fill="url(#grid)"/>
  <rect width="1200" height="720" fill="url(#bgGlow)"/>

  <!-- ========================================================= -->
  <!-- HEADER -->
  <!-- ========================================================= -->

  <text
    x="600"
    y="55"
    text-anchor="middle"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="34"
    font-weight="900"
    fill="url(#brand)">
    OMAR
  </text>

  <text
    x="600"
    y="84"
    text-anchor="middle"
    font-family="Inter, Segoe UI, Arial, sans-serif"
    font-size="18"
    font-weight="700"
    fill="#f7f6fc">
    DATA ANALYST
  </text>

  <text
    x="600"
    y="110"
    text-anchor="middle"
    font-family="Consolas, monospace"
    font-size="11"
    letter-spacing="2"
    fill="#71717a">
    TURNING RAW DATA INTO ACTIONABLE INSIGHTS
  </text>

  <!-- ========================================================= -->
  <!-- DATA SOURCES LABEL -->
  <!-- ========================================================= -->

  <text
    x="600"
    y="145"
    text-anchor="middle"
    font-family="Consolas, monospace"
    font-size="10"
    letter-spacing="3"
    font-weight="700"
    fill="#8b5cf6">
    DATA SOURCES
  </text>

  <!-- ========================================================= -->
  <!-- SOURCE CARDS -->
  <!-- ========================================================= -->

  <!-- CSV / Excel -->
  <g transform="translate(55 165)">
    <rect width="190" height="135" rx="14"
          fill="url(#card)"
          stroke="#22c55e"
          stroke-opacity="0.35"/>

    <text x="20" y="32"
          font-family="Consolas, monospace"
          font-size="10"
          letter-spacing="2"
          fill="#22c55e">
      SOURCE 01
    </text>

    <text x="20" y="68"
          font-family="Inter, Segoe UI, Arial"
          font-size="17"
          font-weight="800"
          fill="#f7f6fc">
      CSV / EXCEL
    </text>

    <text x="20" y="92"
          font-family="Consolas, monospace"
          font-size="10"
          fill="#71717a">
      tables · spreadsheets
    </text>

    <circle cx="165" cy="108" r="4" fill="#22c55e">
      <animate
        attributeName="opacity"
        values="1;0.25;1"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- SQL -->
  <g transform="translate(255 165)">
    <rect width="190" height="135" rx="14"
          fill="url(#card)"
          stroke="#3b82f6"
          stroke-opacity="0.45"/>

    <text x="20" y="32"
          font-family="Consolas, monospace"
          font-size="10"
          letter-spacing="2"
          fill="#60a5fa">
      SOURCE 02
    </text>

    <text x="20" y="68"
          font-family="Inter, Segoe UI, Arial"
          font-size="17"
          font-weight="800"
          fill="#f7f6fc">
      SQL DATABASE
    </text>

    <text x="20" y="92"
          font-family="Consolas, monospace"
          font-size="10"
          fill="#71717a">
      relational · structured
    </text>

    <circle cx="165" cy="108" r="4" fill="#3b82f6">
      <animate
        attributeName="opacity"
        values="1;0.25;1"
        dur="2.2s"
        repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- APIs -->
  <g transform="translate(505 165)">
    <rect width="190" height="135" rx="14"
          fill="url(#card)"
          stroke="#f59e0b"
          stroke-opacity="0.4"/>

    <text x="20" y="32"
          font-family="Consolas, monospace"
          font-size="10"
          letter-spacing="2"
          fill="#f59e0b">
      SOURCE 03
    </text>

    <text x="20" y="68"
          font-family="Inter, Segoe UI, Arial"
          font-size="17"
          font-weight="800"
          fill="#f7f6fc">
      APIs
    </text>

    <text x="20" y="92"
          font-family="Consolas, monospace"
          font-size="10"
          fill="#71717a">
      live · external data
    </text>

    <circle cx="165" cy="108" r="4" fill="#f59e0b">
      <animate
        attributeName="opacity"
        values="1;0.25;1"
        dur="1.8s"
        repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CRM -->
  <g transform="translate(755 165)">
    <rect width="190" height="135" rx="14"
          fill="url(#card)"
          stroke="#ec4899"
          stroke-opacity="0.4"/>

    <text x="20" y="32"
          font-family="Consolas, monospace"
          font-size="10"
          letter-spacing="2"
          fill="#ec4899">
      SOURCE 04
    </text>

    <text x="20" y="68"
          font-family="Inter, Segoe UI, Arial"
          font-size="17"
          font-weight="800"
          fill="#f7f6fc">
      CRM / ERP
    </text>

    <text x="20" y="92"
          font-family="Consolas, monospace"
          font-size="10"
          fill="#71717a">
      customers · operations
    </text>

    <circle cx="165" cy="108" r="4" fill="#ec4899">
      <animate
        attributeName="opacity"
        values="1;0.25;1"
        dur="2.4s"
        repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- WEB -->
  <g transform="translate(955 165)">
    <rect width="190" height="135" rx="14"
          fill="url(#card)"
          stroke="#06b6d4"
          stroke-opacity="0.4"/>

    <text x="20" y="32"
          font-family="Consolas, monospace"
          font-size="10"
          letter-spacing="2"
          fill="#22d3ee">
      SOURCE 05
    </text>

    <text x="20" y="68"
          font-family="Inter, Segoe UI, Arial"
          font-size="17"
          font-weight="800"
          fill="#f7f6fc">
      WEB DATA
    </text>

    <text x="20" y="92"
          font-family="Consolas, monospace"
          font-size="10"
          fill="#71717a">
      external · public data
    </text>

    <circle cx="165" cy="108" r="4" fill="#22d3ee">
      <animate
        attributeName="opacity"
        values="1;0.25;1"
        dur="2.1s"
        repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ========================================================= -->
  <!-- SOURCE CONNECTIONS -->
  <!-- ========================================================= -->

  <g fill="none"
     stroke="#6366f1"
     stroke-width="1.2"
     stroke-dasharray="3 6"
     opacity="0.45">

    <use href="#source1"/>
    <use href="#source2"/>
    <use href="#source3"/>
    <use href="#source4"/>
    <use href="#source5"/>

  </g>

  <!-- animated incoming data -->
  <g fill="#a78bfa">

    <circle r="3">
      <animateMotion
        dur="2s"
        repeatCount="indefinite">
        <mpath href="#source1"/>
      </animateMotion>
    </circle>

    <circle r="3">
      <animateMotion
        dur="2s"
        begin="0.5s"
        repeatCount="indefinite">
        <mpath href="#source2"/>
      </animateMotion>
    </circle>

    <circle r="3">
      <animateMotion
        dur="2s"
        begin="1s"
        repeatCount="indefinite">
        <mpath href="#source3"/>
      </animateMotion>
    </circle>

    <circle r="3">
      <animateMotion
        dur="2s"
        begin="1.5s"
        repeatCount="indefinite">
        <mpath href="#source4"/>
      </animateMotion>
    </circle>

    <circle r="3">
      <animateMotion
        dur="2s"
        begin="2s"
        repeatCount="indefinite">
        <mpath href="#source5"/>
      </animateMotion>
    </circle>

  </g>

  <!-- ========================================================= -->
  <!-- OMAR ANALYTICS HUB -->
  <!-- ========================================================= -->

  <g>

    <rect x="250" y="350"
          width="700"
          height="125"
          rx="18"
          fill="url(#card)"
          stroke="#8b5cf6"
          stroke-width="1.4"
          stroke-opacity="0.65"/>

    <!-- Glow -->
    <circle cx="310" cy="412"
            r="45"
            fill="url(#hubGlow)"
            filter="url(#softGlow)">

      <animate
        attributeName="r"
        values="38;52;38"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>

    <!-- analytics icon -->
    <g transform="translate(278 380)"
       fill="none"
       stroke="#8b5cf6"
       stroke-width="4"
       stroke-linecap="round">

      <line x1="8" y1="60" x2="8" y2="38"/>
      <line x1="25" y1="60" x2="25" y2="25"/>
      <line x1="42" y1="60" x2="42" y2="12"/>

      <path d="M4 62 L24 43 L39 48 L62 18"
            stroke="#22d3ee"/>

      <circle cx="62" cy="18" r="4"
              fill="#22d3ee"
              stroke="none">

        <animate
          attributeName="r"
          values="3;6;3"
          dur="1.6s"
          repeatCount="indefinite"/>

      </circle>

    </g>

    <text x="360" y="392"
          font-family="Inter, Segoe UI, Arial"
          font-size="24"
          font-weight="900"
          fill="url(#brand)">
      OMAR — DATA ANALYTICS HUB
    </text>

    <text x="360" y="420"
          font-family="Consolas, monospace"
          font-size="11"
          fill="#a1a1aa">
      CLEAN → ANALYZE → VISUALIZE → EXPLAIN
    </text>

    <text x="360" y="446"
          font-family="Consolas, monospace"
          font-size="11"
          fill="#71717a">
      data cleaning · EDA · SQL · statistics · business intelligence
    </text>

    <!-- status -->
    <circle cx="910" cy="375"
            r="5"
            fill="#22c55e">

      <animate
        attributeName="opacity"
        values="1;0.35;1"
        dur="1.7s"
        repeatCount="indefinite"/>

    </circle>

    <text x="865" y="397"
          font-family="Consolas, monospace"
          font-size="9"
          fill="#22c55e">
      ANALYZING
    </text>

  </g>

  <!-- ========================================================= -->
  <!-- HUB → TOOLS CONNECTIONS -->
  <!-- ========================================================= -->

  <g fill="none"
     stroke="#8b5cf6"
     stroke-width="1.3"
     stroke-dasharray="3 6"
     opacity="0.5">

    <use href="#tool1"/>
    <use href="#tool2"/>
    <use href="#tool3"/>
    <use href="#tool4"/>

  </g>

  <!-- Moving data particles -->
  <g fill="#c4b5fd">

    <circle r="3.5">
      <animateMotion
        dur="2.3s"
        repeatCount="indefinite">
        <mpath href="#tool1"/>
      </animateMotion>
    </circle>

    <circle r="3.5">
      <animateMotion
        dur="2.3s"
        begin="0.55s"
        repeatCount="indefinite">
        <mpath href="#tool2"/>
      </animateMotion>
    </circle>

    <circle r="3.5">
      <animateMotion
        dur="2.3s"
        begin="1.1s"
        repeatCount="indefinite">
        <mpath href="#tool3"/>
      </animateMotion>
    </circle>

    <circle r="3.5">
      <animateMotion
        dur="2.3s"
        begin="1.65s"
        repeatCount="indefinite">
        <mpath href="#tool4"/>
      </animateMotion>
    </circle>

  </g>

  <!-- ========================================================= -->
  <!-- ANALYTICS TOOLS -->
  <!-- ========================================================= -->

  <!-- SQL -->
  <g transform="translate(55 550)">

    <rect width="250" height="105"
          rx="15"
          fill="url(#card)"
          stroke="#3b82f6"
          stroke-opacity="0.7"/>

    <text x="20" y="28"
          font-family="Consolas, monospace"
          font-size="10"
          letter-spacing="2"
          fill="#60a5fa">
      ANALYTICS 01
    </text>

    <text x="20" y="58"
          font-family="Inter, Segoe UI, Arial"
          font-size="19"
          font-weight="900"
          fill="#f7f6fc">
      SQL
    </text>

    <text x="20" y="82"
          font-family="Consolas, monospace"
          font-size="10"
          fill="#71717a">
      queries · joins · aggregations
    </text>

    <circle cx="220" cy="30"
            r="4"
            fill="#3b82f6"/>

  </g>

  <!-- Python -->
  <g transform="translate(325 550)">

    <rect width="250" height="105"
          rx="15"
          fill="url(#card)"
          stroke="#f59e0b"
          stroke-opacity="0.7"/>

    <text x="20" y="28"
          font-family="Consolas, monospace"
          font-size="10"
          letter-spacing="2"
          fill="#f59e0b">
      ANALYTICS 02
    </text>

    <text x="20" y="58"
          font-family="Inter, Segoe UI, Arial"
          font-size="19"
          font-weight="900"
          fill="#f7f6fc">
      PYTHON
    </text>

    <text x="20" y="82"
          font-family="Consolas, monospace"
          font-size="10"
          fill="#71717a">
      pandas · numpy · EDA · statistics
    </text>

    <circle cx="220" cy="30"
            r="4"
            fill="#f59e0b"/>

  </g>

  <!-- Power BI -->
  <g transform="translate(595 550)">

    <rect width="250" height="105"
          rx="15"
          fill="url(#card)"
          stroke="#22c55e"
          stroke-opacity="0.7"/>

    <text x="20" y="28"
          font-family="Consolas, monospace"
          font-size="10"
          letter-spacing="2"
          fill="#22c55e">
      ANALYTICS 03
    </text>

    <text x="20" y="58"
          font-family="Inter, Segoe UI, Arial"
          font-size="19"
          font-weight="900"
          fill="#f7f6fc">
      POWER BI
    </text>

    <text x="20" y="82"
          font-family="Consolas, monospace"
          font-size="10"
          fill="#71717a">
      dashboards · KPIs · DAX
    </text>

    <circle cx="220" cy="30"
            r="4"
            fill="#22c55e"/>

  </g>

  <!-- Excel -->
  <g transform="translate(865 550)">

    <rect width="250" height="105"
          rx="15"
          fill="url(#card)"
          stroke="#22d3ee"
          stroke-opacity="0.7"/>

    <text x="20" y="28"
          font-family="Consolas, monospace"
          font-size="10"
          letter-spacing="2"
          fill="#22d3ee">
      ANALYTICS 04
    </text>

    <text x="20" y="58"
          font-family="Inter, Segoe UI, Arial"
          font-size="19"
          font-weight="900"
          fill="#f7f6fc">
      EXCEL
    </text>

    <text x="20" y="82"
          font-family="Consolas, monospace"
          font-size="10"
          fill="#71717a">
      pivots · formulas · reporting
    </text>

    <circle cx="220" cy="30"
            r="4"
            fill="#22d3ee"/>

  </g>

  <!-- ========================================================= -->
  <!-- BOTTOM FLOW -->
  <!-- ========================================================= -->

  <path
    d="M180 682 H1020"
    stroke="#6366f1"
    stroke-opacity="0.25"
    stroke-width="1"
    stroke-dasharray="3 7"/>

  <circle r="3.5" fill="#22d3ee">

    <animateMotion
      dur="4s"
      repeatCount="indefinite">
      <mpath href="#finalFlow"/>
    </animateMotion>

  </circle>

  <text
    x="600"
    y="704"
    text-anchor="middle"
    font-family="Consolas, monospace"
    font-size="10"
    letter-spacing="3"
    font-weight="700"
    fill="#71717a">
    RAW DATA → INSIGHTS → DECISIONS
  </text>

</svg>
